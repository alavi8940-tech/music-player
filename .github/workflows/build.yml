name: Build Music Player

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build web
      run: npm run build

    - name: Upload web build
      uses: actions/upload-artifact@v4
      with:
        name: music-player-web
        path: dist/
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    needs: build-web
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build web
      run: npm run build

    - name: Build Electron Linux
      run: npx electron-builder --linux --config

    - name: Upload Linux build
      uses: actions/upload-artifact@v4
      with:
        name: music-player-linux
        path: release/*.AppImage
        retention-days: 30
